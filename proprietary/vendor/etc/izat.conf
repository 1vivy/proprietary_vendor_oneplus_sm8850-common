#####################################
# IZAT PREMIUM FEATURE SETTINGS
#####################################
#SAP valid modes:
# DISABLED
# BASIC
# PREMIUM
# PREMIUM_ENV_AIDING
# MODEM_DEFAULT
SAP=MODEM_DEFAULT

#SUPL_WIFI valid modes:
#DISABLED
#BASIC
SUPL_WIFI=BASIC

#Configure Embargoed MCC list:
# MCCs are separated by delimiter ~.
# If regulation is specific to certain MNCs within MCC MNCs are
# represented inside [] next to MCC separated with coma(,)
# Software default currently is: ~460~368~432~417~250[32,33,34,60]~467
#EMBARGOED_MCC_LIST= ~460~368~432~417~250[32,33,34,60]~467

#Configure Embargoed SID ranges:
# Each range is included in [].
# Min and max values in SID ranges separated by ',' respectively
# Software default currently is: [13568,14335][25600,26111][7825,7825]
#EMBARGOED_SID_LIST= [13568,14335][25600,26111][7825,7825]

#####################################
# Location process launcher settings
#####################################

# DO NOT MODIFY
# Modifying below attributes without
# caution can have serious implications.

#Values for PROCESS_STATE:
# ENABLED
# DISABLED

#PROCESS_NAME
# Name of the executable file.

#LAUNCH TRIGGER MASK cab be logical OR of below events
# LOC_ON_LOCATION_ENABLE 0x1
# LOC_ON_OPT_IN 0x2
# LOC_ON_PRECISE_TRACKING_START 0x4
# LOC_ON_TRACKING_START  0x8
# LOC_ON_EMERGENCY 0x10
# LOC_ON_NTRIP_START 0x20
# LOC_ON_NLP_SESSION_START 0x40

PROCESS_NAME=xtwifi-client
PROCESS_ARGUMENT=
PROCESS_STATE=DISABLED
PROCESS_GROUPS=wifi inet gps system qwes oem_2904 vendor_ssgtzd logd leprop
LAUNCH_TRIGGER_MASK=0x53

PROCESS_NAME=slim_daemon
PROCESS_ARGUMENT=
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps oem_2901 can plugdev diag sensors vnw logd leprop
LAUNCH_TRIGGER_MASK=0xc

PROCESS_NAME=edgnss-daemon
PROCESS_ARGUMENT=
PROCESS_STATE=DISABLED
PROCESS_GROUPS=inet gps logd system leprop
LAUNCH_TRIGGER_MASK=0x28

########################################
# Engine Service which host DRE module #
# To enable DRE engine service, change #
# PROCESS_STATE=ENABLED                #
########################################
PROCESS_NAME=engine-service
PROCESS_ARGUMENT=DRE-INT libqfe.so
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps diag inet qwes oem_2901 system drmrpc logd leprop
LAUNCH_TRIGGER_MASK=0xc

########################################
# Engine Service which host PPE module #
# To enable PPE engine service, change #
# PROCESS_STATE=ENABLED                #
# and update process arugements        #
# with PPE library name                #
#PROCESS_ARGUMENT=PPE libepsimulator.so#
########################################
PROCESS_NAME=engine-service
PROCESS_ARGUMENT=PPE libepsimulator.so
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps diag inet qwes oem_2901 system drmrpc logd leprop
LAUNCH_TRIGGER_MASK=0xc

#########################################
# Engine Service which host QPPE module #
# To enable QPPE engine service, change #
# PROCESS_STATE=ENABLED                 #
#########################################
PROCESS_NAME=engine-service
PROCESS_ARGUMENT=PPE-INT libqppe.so
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps diag drmrpc logd leprop
LAUNCH_TRIGGER_MASK=0xc

########################################
# Skyhook process on LE platform       #
# To enable Skyhook process, change    #
# PROCESS_STATE=ENABLED                #
########################################
PROCESS_NAME=blpsvc
PROCESS_ARGUMENT=
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps inet logd
LAUNCH_TRIGGER_MASK=0

PROCESS_NAME=LocIdlAPIService
PROCESS_ARGUMENT=
PROCESS_STATE=DISABLED
PROCESS_GROUPS=gps vnw powermgr logd locclient sensors leprop
LAUNCH_TRIGGER_MASK=0
